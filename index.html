<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حاسبة مصنعية التشطيبات</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f3542">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصنعية">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --paper:#f2ede4;
    --paper-dark:#e7ddc8;
    --ink:#2b2a26;
    --ink-soft:#5c574c;
    --blueprint:#2e4a5e;
    --blueprint-dark:#1f3542;
    --ochre:#c07a2b;
    --ochre-soft:#e8a95a;
    --line:#c9bd9e;
    --good:#3f6b4a;
    --card:#faf7ef;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(46,74,94,0.045) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(46,74,94,0.045) 39px 40px),
      var(--paper);
    color:var(--ink);
    font-family:'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header.top{
    background:var(--blueprint-dark);
    color:#f2ede4;
    padding:22px 20px 18px;
    border-bottom:6px solid var(--ochre);
    position:relative;
  }
  header.top h1{
    font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-weight:900;
    font-size:1.5rem;
    margin:0 0 4px;
    letter-spacing:.5px;
  }
  header.top .sub{
    font-size:.85rem;
    color:#c9d6dc;
    opacity:.85;
  }
  .project-meta{
    display:flex;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .project-meta input{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    padding:8px 12px;
    border-radius:6px;
    font-family:'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-size:.85rem;
    flex:1;
    min-width:160px;
  }
  .project-meta input::placeholder{color:#b8c4c9;}

  nav.tabs{
    display:flex;
    background:var(--paper-dark);
    border-bottom:2px solid var(--line);
    overflow-x:auto;
  }
  nav.tabs button{
    flex:1;
    min-width:120px;
    padding:13px 10px;
    background:none;
    border:none;
    font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-weight:700;
    font-size:.85rem;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{
    color:var(--blueprint-dark);
    border-bottom-color:var(--ochre);
    background:var(--paper);
  }

  main{max-width:920px;margin:0 auto;padding:18px 16px 40px;}
  section.tabpanel{display:none;}
  section.tabpanel.active{display:block;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(43,42,38,.08);
  }
  .card h2{
    font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-size:1.05rem;
    margin:0 0 12px;
    color:var(--blueprint-dark);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .tag{
    font-size:.7rem;
    background:var(--blueprint);
    color:#fff;
    padding:2px 8px;
    border-radius:20px;
    font-weight:500;
  }

  .field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .field{flex:1;min-width:110px;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:.72rem;color:var(--ink-soft);font-weight:600;}
  .field input, .field select{
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-size:.9rem;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--ochre-soft);border-color:var(--ochre);}

  .openings-list, .item-list{margin:8px 0;display:flex;flex-direction:column;gap:6px;}
  .opening-row, .item-row{
    display:flex;
    gap:8px;
    align-items:center;
    background:#fff;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 8px;
    flex-wrap:wrap;
  }
  .opening-row input, .item-row input, .item-row select{
    padding:6px 8px;font-size:.82rem;border:1px solid var(--line);border-radius:5px;flex:1;min-width:70px;
  }
  .opening-row span, .item-row span{font-size:.75rem;color:var(--ink-soft);}

  .btn{
    border:none;
    border-radius:7px;
    padding:8px 14px;
    font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-weight:700;
    font-size:.82rem;
    cursor:pointer;
  }
  .btn-primary{background:var(--blueprint);color:#fff;}
  .btn-primary:hover{background:var(--blueprint-dark);}
  .btn-ochre{background:var(--ochre);color:#fff;}
  .btn-ochre:hover{background:#a9661e;}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  .btn-outline:hover{background:var(--paper-dark);}
  .btn-danger{background:transparent;color:#a3392e;border:1px solid #d9b3ae;padding:5px 9px;font-size:.75rem;}
  .btn-danger:hover{background:#f7e8e6;}
  .btn-sm{padding:5px 10px;font-size:.75rem;}

  .room-block{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    margin-bottom:14px;
    background:#fff;
    position:relative;
  }
  .room-block .room-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
  }
  .room-head h3{margin:0;font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;font-size:1rem;color:var(--blueprint-dark);}
  .room-result{
    margin-top:10px;
    padding:10px 12px;
    background:var(--paper);
    border-radius:6px;
    font-size:.85rem;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 14px;
  }
  .room-result .grand{
    grid-column:1/-1;
    font-weight:700;
    color:var(--ochre);
    border-top:1px dashed var(--line);
    padding-top:6px;
    margin-top:4px;
    font-size:.95rem;
  }

  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:.85rem;
    padding:20px;
    border:1px dashed var(--line);
    border-radius:8px;
  }

  /* Report */
  .report-header{
    text-align:center;
    border-bottom:3px double var(--blueprint-dark);
    padding-bottom:12px;
    margin-bottom:16px;
  }
  .report-header h2{
    font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    color:var(--blueprint-dark);
    margin:0 0 4px;
    font-size:1.3rem;
  }
  .report-header .meta-line{font-size:.85rem;color:var(--ink-soft);}
  table.report-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:.85rem;}
  table.report-table th{
    background:var(--blueprint-dark);color:#fff;padding:8px;text-align:right;font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;font-size:.78rem;
  }
  table.report-table td{padding:7px 8px;border-bottom:1px solid var(--line);}
  table.report-table tr:nth-child(even) td{background:var(--paper);}
  .section-title-report{
    font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-weight:700;
    color:var(--ochre);
    margin:18px 0 8px;
    font-size:1rem;
    display:flex;align-items:center;gap:8px;
  }
  .section-title-report::before{content:'';flex:0 0 4px;height:16px;background:var(--ochre);border-radius:2px;}
  .subtotal-line{
    display:flex;justify-content:space-between;
    font-weight:700;color:var(--blueprint-dark);
    padding:8px 10px;background:var(--paper-dark);border-radius:6px;margin-bottom:6px;
  }
  .grand-total-box{
    margin-top:20px;
    background:var(--blueprint-dark);
    color:#fff;
    border-radius:10px;
    padding:18px;
    text-align:center;
  }
  .grand-total-box .label{font-size:.85rem;color:#c9d6dc;margin-bottom:6px;}
  .grand-total-box .amount{
    font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-weight:900;
    font-size:2rem;
    color:var(--ochre-soft);
  }
  .stamp{
    position:absolute;
    top:10px;left:10px;
    font-family:'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-size:.65rem;
    color:var(--ink-soft);
    opacity:.6;
    border:1px solid var(--line);
    padding:2px 8px;
    border-radius:20px;
  }
  .report-actions{display:flex;gap:8px;margin-bottom:16px;}

  @media print{
    header.top, nav.tabs, .no-print{display:none !important;}
    body{background:#fff;}
    section.tabpanel{display:none;}
    section.tabpanel#report{display:block;}
    main{max-width:100%;padding:0;}
  }
</style>
</head>
<body>

<header class="top">
  <h1>حاسبة مصنعية التشطيبات</h1>
  <div class="sub">دهانات · جبس وديكورات · أخشاب — بدون خامات</div>
  <div class="project-meta">
    <input id="projectName" placeholder="اسم المشروع (مثال: فيلا التجمع الخامس)">
    <input id="clientName" placeholder="اسم العميل">
    <button id="installBtn" class="btn btn-ochre" style="display:none;">+ تثبيت التطبيق</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="rooms">الحوائط والأسقف</button>
  <button class="tab-btn" data-tab="gypsum">الجبس والديكورات</button>
  <button class="tab-btn" data-tab="wood">دهانات الأخشاب</button>
  <button class="tab-btn" data-tab="report">التقرير النهائي</button>
</nav>

<main>

  <!-- ROOMS TAB -->
  <section id="rooms" class="tabpanel active">
    <div id="roomsContainer"></div>
    <button class="btn btn-primary" id="addRoomBtn">+ إضافة غرفة جديدة</button>
  </section>

  <!-- GYPSUM TAB -->
  <section id="gypsum" class="tabpanel">
    <div class="card">
      <h2>بنود الجبس والكرانيش والديكورات <span class="tag">حسب البند</span></h2>
      <div class="item-list" id="gypsumList"></div>
      <button class="btn btn-ochre btn-sm" id="addGypsumBtn">+ إضافة بند</button>
    </div>
  </section>

  <!-- WOOD TAB -->
  <section id="wood" class="tabpanel">
    <div class="card">
      <h2>دهانات الأخشاب <span class="tag">بالقطعة</span></h2>
      <div class="item-list" id="woodList"></div>
      <button class="btn btn-ochre btn-sm" id="addWoodBtn">+ إضافة قطعة خشب</button>
    </div>
  </section>

  <!-- REPORT TAB -->
  <section id="report" class="tabpanel">
    <div class="report-actions no-print">
      <button class="btn btn-outline" onclick="window.print()">طباعة / حفظ PDF</button>
      <button class="btn btn-outline" id="refreshReportBtn">تحديث التقرير</button>
    </div>
    <div id="reportContent"></div>
  </section>

</main>

<script>
let state = {
  projectName: '',
  clientName: '',
  rooms: [],
  gypsumItems: [],
  woodItems: []
};
let roomCounter = 0, gypsumCounter = 0, woodCounter = 0;

// ---------- Persistence ----------
async function saveState(){
  try{
    await window.storage.set('finishing-project', JSON.stringify(state));
  }catch(e){ console.error('save failed', e); }
}
async function loadState(){
  try{
    const res = await window.storage.get('finishing-project');
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      state = Object.assign(state, loaded);
    }
  }catch(e){ /* no saved data yet */ }
}

// ---------- Helpers ----------
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(n){ return n.toLocaleString('ar-EG', {maximumFractionDigits:2}); }

function newRoom(){
  roomCounter++;
  return { id:'r'+roomCounter+'-'+Date.now(), name:'', perimeter:'', height:'', ceilingL:'', ceilingW:'', price:'', openings:[] };
}
function newOpening(){
  return { id:'o'+Date.now()+Math.random().toString(16).slice(2), w:'', h:'', qty:1 };
}
function newGypsumItem(){
  gypsumCounter++;
  return { id:'g'+gypsumCounter+'-'+Date.now(), name:'', unit:'م.ط', qty:'', price:'' };
}
function newWoodItem(){
  woodCounter++;
  return { id:'w'+woodCounter+'-'+Date.now(), name:'', qty:1, price:'' };
}

// ---------- Calculations ----------
function calcRoom(room){
  const perimeter = num(room.perimeter);
  const height = num(room.height);
  const ceilingL = num(room.ceilingL);
  const ceilingW = num(room.ceilingW);
  const price = num(room.price);
  let openingsArea = 0;
  room.openings.forEach(o=>{ openingsArea += num(o.w) * num(o.h) * num(o.qty || 1); });
  const wallArea = Math.max(0, perimeter * height - openingsArea);
  const ceilingArea = ceilingL * ceilingW;
  const totalArea = wallArea + ceilingArea;
  const cost = totalArea * price;
  return { wallArea, ceilingArea, totalArea, cost, openingsArea };
}
function calcGypsum(item){ return num(item.qty) * num(item.price); }
function calcWood(item){ return num(item.qty || 1) * num(item.price); }

function totals(){
  const roomsTotal = state.rooms.reduce((s,r)=> s + calcRoom(r).cost, 0);
  const gypsumTotal = state.gypsumItems.reduce((s,g)=> s + calcGypsum(g), 0);
  const woodTotal = state.woodItems.reduce((s,w)=> s + calcWood(w), 0);
  return { roomsTotal, gypsumTotal, woodTotal, grand: roomsTotal + gypsumTotal + woodTotal };
}

// ---------- In-place updates (no DOM rebuild -> keyboard & focus stay put) ----------
function updateRoomResult(room){
  const r = calcRoom(room);
  const wallEl = document.getElementById('wallArea-'+room.id);
  const ceilEl = document.getElementById('ceilingArea-'+room.id);
  const totalEl = document.getElementById('totalArea-'+room.id);
  const priceEl = document.getElementById('unitPrice-'+room.id);
  const costEl = document.getElementById('roomCost-'+room.id);
  if(wallEl) wallEl.textContent = fmt(r.wallArea) + ' م²';
  if(ceilEl) ceilEl.textContent = fmt(r.ceilingArea) + ' م²';
  if(totalEl) totalEl.textContent = fmt(r.totalArea) + ' م²';
  if(priceEl) priceEl.textContent = fmt(num(room.price)) + ' ج.م';
  if(costEl) costEl.textContent = fmt(r.cost);
}
function updateGypsumCost(item){
  const el = document.getElementById('gypsum-cost-'+item.id);
  if(el) el.textContent = fmt(calcGypsum(item)) + ' ج.م';
}
function updateWoodCost(item){
  const el = document.getElementById('wood-cost-'+item.id);
  if(el) el.textContent = fmt(calcWood(item)) + ' ج.م';
}

// ---------- Rendering: Rooms ----------
function renderRooms(){
  const container = document.getElementById('roomsContainer');
  if(state.rooms.length === 0){
    container.innerHTML = '<div class="empty-note">لا توجد غرف بعد. اضغط "إضافة غرفة جديدة" للبدء.</div>';
    return;
  }
  container.innerHTML = '';
  state.rooms.forEach(room=>{
    const r = calcRoom(room);
    const block = document.createElement('div');
    block.className = 'room-block';
    block.id = 'room-block-' + room.id;
    block.innerHTML = `
      <div class="room-head">
        <h3>${room.name || 'غرفة بدون اسم'}</h3>
        <button class="btn btn-danger" data-action="del-room" data-id="${room.id}">حذف الغرفة</button>
      </div>
      <div class="field-row">
        <div class="field"><label>اسم الغرفة</label><input data-action="room-field" data-field="name" data-id="${room.id}" value="${room.name}" placeholder="مثال: غرفة النوم الرئيسية"></div>
        <div class="field"><label>محيط الغرفة (م.ط)</label><input type="number" step="0.01" data-action="room-field" data-field="perimeter" data-id="${room.id}" value="${room.perimeter}"></div>
        <div class="field"><label>الارتفاع (م)</label><input type="number" step="0.01" data-action="room-field" data-field="height" data-id="${room.id}" value="${room.height}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>طول السقف (م)</label><input type="number" step="0.01" data-action="room-field" data-field="ceilingL" data-id="${room.id}" value="${room.ceilingL}"></div>
        <div class="field"><label>عرض السقف (م)</label><input type="number" step="0.01" data-action="room-field" data-field="ceilingW" data-id="${room.id}" value="${room.ceilingW}"></div>
        <div class="field"><label>سعر المتر المتفق عليه (ج.م/م²)</label><input type="number" step="0.01" data-action="room-field" data-field="price" data-id="${room.id}" value="${room.price}"></div>
      </div>

      <div style="margin-top:8px;">
        <label style="font-size:.75rem;color:var(--ink-soft);font-weight:600;">الفتحات (أبواب / شبابيك / بلكونات) تُطرح من الحوائط</label>
        <div class="openings-list" data-openings-for="${room.id}"></div>
        <button class="btn btn-outline btn-sm" data-action="add-opening" data-id="${room.id}" style="margin-top:6px;">+ إضافة فتحة</button>
      </div>

      <div class="room-result" data-room-result="${room.id}">
        <div>مساحة الحوائط (بعد خصم الفتحات): <strong id="wallArea-${room.id}">${fmt(r.wallArea)} م²</strong></div>
        <div>مساحة السقف: <strong id="ceilingArea-${room.id}">${fmt(r.ceilingArea)} م²</strong></div>
        <div>إجمالي المساحة: <strong id="totalArea-${room.id}">${fmt(r.totalArea)} م²</strong></div>
        <div>سعر المتر: <strong id="unitPrice-${room.id}">${fmt(num(room.price))} ج.م</strong></div>
        <div class="grand">إجمالي مصنعية الغرفة: <span id="roomCost-${room.id}">${fmt(r.cost)}</span> ج.م</div>
      </div>
    `;
    container.appendChild(block);

    const openingsContainer = block.querySelector(`[data-openings-for="${room.id}"]`);
    if(room.openings.length === 0){
      openingsContainer.innerHTML = '<div style="font-size:.78rem;color:var(--ink-soft);">لا توجد فتحات مضافة</div>';
    } else {
      room.openings.forEach(op=>{
        const row = document.createElement('div');
        row.className = 'opening-row';
        row.innerHTML = `
          <span>عرض</span><input type="number" step="0.01" data-action="opening-field" data-field="w" data-room="${room.id}" data-op="${op.id}" value="${op.w}">
          <span>ارتفاع</span><input type="number" step="0.01" data-action="opening-field" data-field="h" data-room="${room.id}" data-op="${op.id}" value="${op.h}">
          <span>عدد</span><input type="number" step="1" min="1" data-action="opening-field" data-field="qty" data-room="${room.id}" data-op="${op.id}" value="${op.qty}">
          <button class="btn btn-danger btn-sm" data-action="del-opening" data-room="${room.id}" data-op="${op.id}">حذف</button>
        `;
        openingsContainer.appendChild(row);
      });
    }
  });
}

// ---------- Rendering: Gypsum ----------
function renderGypsum(){
  const list = document.getElementById('gypsumList');
  if(state.gypsumItems.length === 0){
    list.innerHTML = '<div class="empty-note">لا توجد بنود جبس/ديكورات بعد.</div>';
    return;
  }
  list.innerHTML = '';
  state.gypsumItems.forEach(item=>{
    const cost = calcGypsum(item);
    const row = document.createElement('div');
    row.className = 'item-row';
    row.id = 'gypsum-row-' + item.id;
    row.innerHTML = `
      <input placeholder="اسم البند (كرانيش، سقف معلق، سرة...)" data-action="gypsum-field" data-field="name" data-id="${item.id}" value="${item.name}" style="min-width:160px;">
      <select data-action="gypsum-field" data-field="unit" data-id="${item.id}">
        <option value="م.ط" ${item.unit==='م.ط'?'selected':''}>متر طولي</option>
        <option value="م²" ${item.unit==='م²'?'selected':''}>متر مربع</option>
        <option value="قطعة" ${item.unit==='قطعة'?'selected':''}>قطعة</option>
      </select>
      <input type="number" step="0.01" placeholder="الكمية" data-action="gypsum-field" data-field="qty" data-id="${item.id}" value="${item.qty}">
      <input type="number" step="0.01" placeholder="سعر الوحدة" data-action="gypsum-field" data-field="price" data-id="${item.id}" value="${item.price}">
      <span id="gypsum-cost-${item.id}" style="font-weight:700;color:var(--blueprint-dark);white-space:nowrap;">${fmt(cost)} ج.م</span>
      <button class="btn btn-danger btn-sm" data-action="del-gypsum" data-id="${item.id}">حذف</button>
    `;
    list.appendChild(row);
  });
}

// ---------- Rendering: Wood ----------
function renderWood(){
  const list = document.getElementById('woodList');
  if(state.woodItems.length === 0){
    list.innerHTML = '<div class="empty-note">لا توجد قطع أخشاب بعد.</div>';
    return;
  }
  list.innerHTML = '';
  state.woodItems.forEach(item=>{
    const cost = calcWood(item);
    const row = document.createElement('div');
    row.className = 'item-row';
    row.id = 'wood-row-' + item.id;
    row.innerHTML = `
      <input placeholder="نوع القطعة (باب رئيسي، شباك درفتين...)" data-action="wood-field" data-field="name" data-id="${item.id}" value="${item.name}" style="min-width:200px;">
      <input type="number" step="1" min="1" placeholder="العدد" data-action="wood-field" data-field="qty" data-id="${item.id}" value="${item.qty}">
      <input type="number" step="0.01" placeholder="سعر القطعة" data-action="wood-field" data-field="price" data-id="${item.id}" value="${item.price}">
      <span id="wood-cost-${item.id}" style="font-weight:700;color:var(--blueprint-dark);white-space:nowrap;">${fmt(cost)} ج.م</span>
      <button class="btn btn-danger btn-sm" data-action="del-wood" data-id="${item.id}">حذف</button>
    `;
    list.appendChild(row);
  });
}

// ---------- Rendering: Report ----------
function renderReport(){
  const t = totals();
  const rc = document.getElementById('reportContent');
  let html = '';
  html += `<div class="report-header">
    <h2>التقرير النهائي لمصنعية المشروع</h2>
    <div class="meta-line">المشروع: ${state.projectName || '—'} &nbsp;|&nbsp; العميل: ${state.clientName || '—'} &nbsp;|&nbsp; التاريخ: ${new Date().toLocaleDateString('ar-EG')}</div>
  </div>`;

  // Rooms section
  html += `<div class="section-title-report">أولاً: الحوائط والأسقف</div>`;
  if(state.rooms.length === 0){
    html += `<div class="empty-note">لا توجد غرفة مضافة</div>`;
  } else {
    html += `<table class="report-table"><thead><tr>
      <th>الغرفة</th><th>مساحة الحوائط م²</th><th>مساحة السقف م²</th><th>الإجمالي م²</th><th>سعر المتر</th><th>الإجمالي (ج.م)</th>
    </tr></thead><tbody>`;
    state.rooms.forEach(room=>{
      const r = calcRoom(room);
      html += `<tr>
        <td>${room.name || '—'}</td>
        <td>${fmt(r.wallArea)}</td>
        <td>${fmt(r.ceilingArea)}</td>
        <td>${fmt(r.totalArea)}</td>
        <td>${fmt(num(room.price))}</td>
        <td><strong>${fmt(r.cost)}</strong></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `<div class="subtotal-line"><span>إجمالي قسم الحوائط والأسقف</span><span>${fmt(t.roomsTotal)} ج.م</span></div>`;

  // Gypsum section
  html += `<div class="section-title-report">ثانياً: الجبس والكرانيش والديكورات</div>`;
  if(state.gypsumItems.length === 0){
    html += `<div class="empty-note">لا توجد بنود مضافة</div>`;
  } else {
    html += `<table class="report-table"><thead><tr><th>البند</th><th>الوحدة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>`;
    state.gypsumItems.forEach(item=>{
      html += `<tr>
        <td>${item.name || '—'}</td>
        <td>${item.unit}</td>
        <td>${fmt(num(item.qty))}</td>
        <td>${fmt(num(item.price))}</td>
        <td><strong>${fmt(calcGypsum(item))}</strong></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `<div class="subtotal-line"><span>إجمالي قسم الجبس والديكورات</span><span>${fmt(t.gypsumTotal)} ج.م</span></div>`;

  // Wood section
  html += `<div class="section-title-report">ثالثاً: دهانات الأخشاب</div>`;
  if(state.woodItems.length === 0){
    html += `<div class="empty-note">لا توجد قطع مضافة</div>`;
  } else {
    html += `<table class="report-table"><thead><tr><th>نوع القطعة</th><th>العدد</th><th>سعر القطعة</th><th>الإجمالي</th></tr></thead><tbody>`;
    state.woodItems.forEach(item=>{
      html += `<tr>
        <td>${item.name || '—'}</td>
        <td>${fmt(num(item.qty))}</td>
        <td>${fmt(num(item.price))}</td>
        <td><strong>${fmt(calcWood(item))}</strong></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `<div class="subtotal-line"><span>إجمالي قسم دهانات الأخشاب</span><span>${fmt(t.woodTotal)} ج.م</span></div>`;

  html += `<div class="grand-total-box">
    <div class="label">الصافي النهائي لمصنعية المشروع بالكامل</div>
    <div class="amount">${fmt(t.grand)} ج.م</div>
  </div>`;

  rc.innerHTML = html;
}

function renderAll(){
  renderRooms();
  renderGypsum();
  renderWood();
  renderReport();
}

// ---------- Event delegation ----------
document.addEventListener('input', (e)=>{
  const t = e.target;
  const action = t.dataset.action;
  if(action === 'room-field'){
    const room = state.rooms.find(r=>r.id===t.dataset.id);
    if(room){
      room[t.dataset.field] = t.value;
      if(t.dataset.field === 'name'){
        const head = document.querySelector(`#room-block-${room.id} .room-head h3`);
        if(head) head.textContent = room.name || 'غرفة بدون اسم';
      }
      updateRoomResult(room);
      saveState();
    }
  } else if(action === 'opening-field'){
    const room = state.rooms.find(r=>r.id===t.dataset.room);
    if(room){
      const op = room.openings.find(o=>o.id===t.dataset.op);
      if(op){ op[t.dataset.field] = t.value; updateRoomResult(room); saveState(); }
    }
  } else if(action === 'gypsum-field'){
    const item = state.gypsumItems.find(g=>g.id===t.dataset.id);
    if(item){ item[t.dataset.field] = t.value; updateGypsumCost(item); saveState(); }
  } else if(action === 'wood-field'){
    const item = state.woodItems.find(w=>w.id===t.dataset.id);
    if(item){ item[t.dataset.field] = t.value; updateWoodCost(item); saveState(); }
  } else if(t.id === 'projectName'){
    state.projectName = t.value; saveState();
  } else if(t.id === 'clientName'){
    state.clientName = t.value; saveState();
  }
});

document.addEventListener('change', (e)=>{
  const t = e.target;
  if(t.dataset.action === 'gypsum-field' && t.tagName === 'SELECT'){
    const item = state.gypsumItems.find(g=>g.id===t.dataset.id);
    if(item){ item.unit = t.value; updateGypsumCost(item); saveState(); }
  }
});

// Helper: after adding a new item, scroll it into view and focus its first input
// without jumping the page around or fighting the keyboard.
function focusNewElement(elId, inputSelector){
  requestAnimationFrame(()=>{
    const el = document.getElementById(elId);
    if(!el) return;
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    const input = el.querySelector(inputSelector);
    if(input){
      setTimeout(()=> input.focus({ preventScroll:true }), 250);
    }
  });
}

document.addEventListener('click', (e)=>{
  const t = e.target;
  const action = t.dataset.action;

  if(t.id === 'addRoomBtn'){
    const room = newRoom();
    state.rooms.push(room); renderRooms(); renderReport(); saveState();
    focusNewElement('room-block-'+room.id, 'input[data-field="name"]');
    return;
  }
  if(t.id === 'addGypsumBtn'){
    const item = newGypsumItem();
    state.gypsumItems.push(item); renderGypsum(); renderReport(); saveState();
    focusNewElement('gypsum-row-'+item.id, 'input[data-field="name"]');
    return;
  }
  if(t.id === 'addWoodBtn'){
    const item = newWoodItem();
    state.woodItems.push(item); renderWood(); renderReport(); saveState();
    focusNewElement('wood-row-'+item.id, 'input[data-field="name"]');
    return;
  }
  if(t.id === 'refreshReportBtn'){ renderReport(); return; }

  if(action === 'del-room'){
    state.rooms = state.rooms.filter(r=>r.id!==t.dataset.id);
    renderRooms(); renderReport(); saveState(); return;
  }
  if(action === 'add-opening'){
    const room = state.rooms.find(r=>r.id===t.dataset.id);
    if(room){
      const op = newOpening();
      room.openings.push(op); renderRooms(); renderReport(); saveState();
      focusNewElement('room-block-'+room.id, `input[data-op="${op.id}"][data-field="w"]`);
    }
    return;
  }
  if(action === 'del-opening'){
    const room = state.rooms.find(r=>r.id===t.dataset.room);
    if(room){ room.openings = room.openings.filter(o=>o.id!==t.dataset.op); renderRooms(); renderReport(); saveState(); }
    return;
  }
  if(action === 'del-gypsum'){
    state.gypsumItems = state.gypsumItems.filter(g=>g.id!==t.dataset.id);
    renderGypsum(); renderReport(); saveState(); return;
  }
  if(action === 'del-wood'){
    state.woodItems = state.woodItems.filter(w=>w.id!==t.dataset.id);
    renderWood(); renderReport(); saveState(); return;
  }
});

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'report') renderReport();
  });
});

// ---------- Init ----------
(async ()=>{
  await loadState();
  document.getElementById('projectName').value = state.projectName || '';
  document.getElementById('clientName').value = state.clientName || '';
  if(state.rooms.length === 0){ state.rooms.push(newRoom()); }
  renderAll();
})();

// ---------- PWA: service worker + install prompt ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'inline-block';
});

document.addEventListener('click', (e)=>{
  if(e.target && e.target.id === 'installBtn'){
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.finally(()=>{
        deferredInstallPrompt = null;
        e.target.style.display = 'none';
      });
    }
  }
});
</script>
